name: Deploy LLM Chatbot API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout latest code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # 3. Add server to known hosts
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # 4. Upload application code
      - name: Upload application files
        run: |
          rsync -avz \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/data/llm-chatbot-main/

      # 5. Install dependencies and restart API
      - name: Deploy and restart API
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'

            set -e

            cd /data/llm-chatbot-main

            echo "========================================="
            echo "Activating virtual environment"
            echo "========================================="

            source venv/bin/activate

            echo "Python version:"
            python --version

            echo "========================================="
            echo "Installing dependencies"
            echo "========================================="

            pip install -r requirements.txt

            echo "========================================="
            echo "Restarting FastAPI service"
            echo "========================================="

            sudo systemctl restart llm.service

            echo "========================================="
            echo "Checking service status"
            echo "========================================="

            sudo systemctl status llm.service --no-pager

            echo "========================================="
            echo "Deployment completed successfully!"
            echo "========================================="

          EOF
