name: Deploy LLM Chatbot API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Get latest code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # 3. Add server to known hosts
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # 4. Install rsync on GitHub runner
      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      # 5. Upload code
      - name: Upload application files
        run: |
          rsync -avz \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/data/llm-chatbot-main/

      # 6. Install dependencies and restart API
      - name: Restart API
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'

            set -e

            cd /data/llm-chatbot-main

            echo "Activating virtual environment..."

            source venv/bin/activate

            echo "Python version:"
            python --version

            echo "Installing dependencies..."

            pip install -r requirements.txt

            echo "Restarting API..."

            sudo systemctl restart llm-chatbot-main

            echo "Checking service..."

            sudo systemctl status llm-chatbot-main --no-pager

          EOF
