name: Deploy LLM Chatbot API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf deploy.tar.gz .

      - name: Upload code to server
        run: |
          scp deploy.tar.gz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/deploy.tar.gz

      - name: Deploy and restart API
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'

            cd /data/llm-chatbot-main

            echo "Extracting new code..."

            tar -xzf /tmp/deploy.tar.gz

            rm -f /tmp/deploy.tar.gz

            echo "Activating virtual environment..."

            source /data/llm-chatbot-main/venv/bin/activate

            echo "Installing dependencies..."

            pip install -r requirements.txt

            echo "Restarting API..."

            sudo systemctl restart llm-chatbot-main

            echo "Checking service status..."

            sudo systemctl status llm-chatbot-main --no-pager

          EOF
